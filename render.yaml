services:
  # ---------------------------------------------------------------------------
  # 1. Homia OS Backend REST API (NestJS)
  # ---------------------------------------------------------------------------
  - type: web
    name: homia-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install --legacy-peer-deps && cd packages/database && npx prisma generate && cd ../../apps/api && npm install --legacy-peer-deps && npm run build
    startCommand: cd packages/database && npx prisma migrate deploy && npx tsx src/seed.ts && cd ../../apps/api && npm run start
    healthCheckPath: /api/properties
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: homia-postgres
          property: connectionString
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: homia-web
          property: url

  # ---------------------------------------------------------------------------
  # 2. Homia OS Frontend Portal (Next.js 15 App Router)
  # ---------------------------------------------------------------------------
  - type: web
    name: homia-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: homia-api
          property: url

# ---------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ---------------------------------------------------------------------------
databases:
  - name: homia-postgres
    databaseName: homia_os
    user: homia_admin
    plan: free
    region: singapore
